<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #faf9f7;
      color: #1a1a1a;
      padding: 16px;
    }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .header svg { width: 24px; height: 24px; }
    .header h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
    .status {
      text-align: center; padding: 20px; border-radius: 16px;
      background: #fff; box-shadow: 0 2px 20px rgba(0,0,0,0.04); margin-bottom: 12px;
    }
    .status-icon { font-size: 32px; margin-bottom: 8px; }
    .status-text { font-size: 13px; color: #666; }
    .timer {
      font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em; margin: 8px 0;
    }
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 12px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-stop { background: #1a1a1a; color: #fff; }
    .btn-outline {
      background: transparent; border: 1.5px solid #e5e5e5;
      color: #1a1a1a; margin-top: 8px;
    }
    .auth-section { margin-bottom: 16px; }
    .auth-section label { display: block; font-size: 12px; color: #666; margin-bottom: 6px; }
    .auth-section input {
      width: 100%; padding: 10px 12px; border: 1.5px solid #e5e5e5;
      border-radius: 10px; font-size: 13px; outline: none; transition: border-color 0.15s;
    }
    .auth-section input:focus { border-color: #1a1a1a; }
    .connected { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #22c55e; margin-bottom: 12px; }
    .connected .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
    .msg { font-size: 12px; text-align: center; padding: 8px; border-radius: 8px; margin-top: 8px; }
    .msg-success { background: #f0fdf4; color: #166534; }
    .msg-error { background: #fef2f2; color: #991b1b; }
    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0; border-top: 1px solid #f0f0f0; margin-top: 12px;
    }
    .toggle-label { font-size: 13px; color: #333; }
    .toggle-sub { font-size: 11px; color: #999; }
    .toggle {
      position: relative; width: 44px; height: 24px; cursor: pointer;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .slider {
      position: absolute; inset: 0; background: #ccc; border-radius: 24px; transition: 0.2s;
    }
    .toggle .slider::before {
      content: ''; position: absolute; height: 18px; width: 18px;
      left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: 0.2s;
    }
    .toggle input:checked + .slider { background: #22c55e; }
    .toggle input:checked + .slider::before { transform: translateX(20px); }
    .idle-info {
      text-align: center; color: #999; font-size: 13px; padding: 20px 8px; line-height: 1.5;
    }
    .recording-pulse {
      display: inline-block; width: 10px; height: 10px; border-radius: 50%;
      background: #ef4444; animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }
    .progress-bar { width: 100%; height: 4px; background: #e5e5e5; border-radius: 2px; margin-top: 12px; overflow: hidden; }
    .progress-fill { height: 100%; background: #1a1a1a; border-radius: 2px; transition: width 0.3s; }
  </style>
</head>
<body>
  <div class="header">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>
    </svg>
    <h1>Rhitmo Recorder</h1>
  </div>

  <!-- Auth -->
  <div id="auth-view" class="auth-section" style="display:none;">
    <label>Cole seu token do Rhitmo:</label>
    <input id="token-input" type="password" placeholder="sb-xxxxx..." />
    <button class="btn btn-outline" id="save-token" style="margin-top:8px;">Conectar</button>
  </div>

  <!-- Connected badge -->
  <div id="connected-badge" class="connected" style="display:none;">
    <span class="dot"></span> Conectado ao Rhitmo
  </div>

  <!-- Idle state -->
  <div id="idle-view" style="display:none;">
    <div class="idle-info">
      Gravação automática ativa.<br/>
      Entre em uma reunião no Google Meet e a gravação iniciará sozinha.
    </div>
  </div>

  <!-- Recording state -->
  <div id="recording-view" style="display:none;">
    <div class="status">
      <div class="status-icon"><span class="recording-pulse"></span></div>
      <div class="timer" id="timer">00:00</div>
      <div class="status-text">Gravando automaticamente...</div>
    </div>
    <button class="btn btn-stop" id="btn-stop">Parar Gravação</button>
  </div>

  <!-- Uploading state -->
  <div id="upload-view" style="display:none;">
    <div class="status">
      <div class="status-icon">⬆️</div>
      <div class="status-text">Enviando para o Rhitmo...</div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:50%"></div></div>
    </div>
  </div>

  <div id="msg" class="msg" style="display:none;"></div>

  <!-- Auto-record toggle -->
  <div id="settings" style="display:none;">
    <div class="toggle-row">
      <div>
        <div class="toggle-label">Gravação automática</div>
        <div class="toggle-sub">Inicia ao entrar no Meet</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="auto-record-toggle" checked />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <button class="btn btn-outline" id="btn-disconnect" style="display:none;">Desconectar</button>

  <script src="popup.js"></script>
</body>
</html>
