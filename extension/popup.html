<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #faf9f7;
      color: #1a1a1a;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .header svg { width: 24px; height: 24px; }
    .header h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
    .status {
      text-align: center;
      padding: 20px;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 2px 20px rgba(0,0,0,0.04);
      margin-bottom: 12px;
    }
    .status-icon { font-size: 32px; margin-bottom: 8px; }
    .status-text { font-size: 13px; color: #666; }
    .timer {
      font-size: 28px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      margin: 8px 0;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-record { background: #ef4444; color: #fff; }
    .btn-stop { background: #1a1a1a; color: #fff; }
    .btn-outline {
      background: transparent;
      border: 1.5px solid #e5e5e5;
      color: #1a1a1a;
      margin-top: 8px;
    }
    .auth-section {
      margin-bottom: 16px;
    }
    .auth-section label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 6px;
    }
    .auth-section input {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #e5e5e5;
      border-radius: 10px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    .auth-section input:focus { border-color: #1a1a1a; }
    .connected {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #22c55e;
      margin-bottom: 12px;
    }
    .connected .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }
    .msg {
      font-size: 12px;
      text-align: center;
      padding: 8px;
      border-radius: 8px;
      margin-top: 8px;
    }
    .msg-success { background: #f0fdf4; color: #166534; }
    .msg-error { background: #fef2f2; color: #991b1b; }
    .no-meet {
      text-align: center;
      color: #999;
      font-size: 13px;
      padding: 24px 0;
    }
    .progress-bar {
      width: 100%;
      height: 4px;
      background: #e5e5e5;
      border-radius: 2px;
      margin-top: 12px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #1a1a1a;
      border-radius: 2px;
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>
    </svg>
    <h1>Rhitmo Recorder</h1>
  </div>

  <!-- Auth -->
  <div id="auth-view" class="auth-section" style="display:none;">
    <label>Cole seu token do Rhitmo:</label>
    <input id="token-input" type="password" placeholder="sb-xxxxx..." />
    <button class="btn btn-outline" id="save-token" style="margin-top:8px;">Conectar</button>
  </div>

  <!-- Connected badge -->
  <div id="connected-badge" class="connected" style="display:none;">
    <span class="dot"></span> Conectado ao Rhitmo
  </div>

  <!-- No Meet -->
  <div id="no-meet" class="no-meet" style="display:none;">
    Abra uma reunião no Google Meet para começar a gravar.
  </div>

  <!-- Main recorder -->
  <div id="recorder" style="display:none;">
    <div class="status">
      <div class="status-icon" id="status-icon">🎙️</div>
      <div class="timer" id="timer">00:00</div>
      <div class="status-text" id="status-text">Pronto para gravar</div>
    </div>
    <button class="btn btn-record" id="btn-record">Iniciar Gravação</button>
    <button class="btn btn-stop" id="btn-stop" style="display:none;">Parar Gravação</button>
    <div id="progress" style="display:none;">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="status-text" id="progress-text" style="margin-top:6px;text-align:center;">Processando...</div>
    </div>
  </div>

  <div id="msg" class="msg" style="display:none;"></div>

  <button class="btn btn-outline" id="btn-disconnect" style="display:none;">Desconectar</button>

  <script src="popup.js"></script>
</body>
</html>
